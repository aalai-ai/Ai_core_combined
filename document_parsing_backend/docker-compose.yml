version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: document-processing-agent:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/document_processor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=documents
      - QDRANT_VECTOR_DIMENSIONS=768
      - EMBEDDING_PROVIDER=openai
      - EMBEDDING_MODEL=nomic-embed-text
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - WORKER_CONCURRENCY=2
      - MAX_UPLOAD_SIZE=52428800
      - STORAGE_PROVIDER=minio
      - MINIO_ENDPOINT=http://192.168.2.11:9998
      - MINIO_ACCESS_KEY=hexradmin
      - MINIO_SECRET_KEY=hexradmin
      - MINIO_BUCKET=ai-upload-doc
      - OLLAMA_BASE_URL=http://192.168.2.10:11434
    depends_on:
      - mongodb
      - redis
      - qdrant
      # - minio

  mongodb:
    image: mongo:6.0-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # minio:
  #   image: minio/minio:latest
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: miniopassword
  #   volumes:
  #     - minio_data:/data
  #   command: server /data --console-address ":9001"

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
  # minio_data:
